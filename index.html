<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sueños Cusisita</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #ffe4ec;
      margin: 0;
      padding: 0;
    }

    header {
      background: #ff69b4;
      color: white;
      text-align: center;
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      padding: 20px;
    }

    input {
      padding: 10px;
      width: 70%;
      border: none;
      border-radius: 10px;
      outline: none;
    }

    button {
      padding: 10px;
      background: #ff1493;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    button:hover {
      background: #ff69b4;
    }

    ul {
      list-style: none;
      padding: 0;
      margin-top: 20px;
    }

    li {
      background: white;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .done {
      text-decoration: line-through;
      color: gray;
    }
  </style>
</head>

<body>

<header>🌸 Sueños Cusisita 🌸</header>

<div class="container">
  <input type="text" id="taskInput" placeholder="Escribe tu sueño o tarea...">
  <button onclick="addTask()">Agregar</button>

  <ul id="taskList"></ul>
</div>

<script>
  let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

  function renderTasks() {
    const list = document.getElementById("taskList");
    list.innerHTML = "";

    tasks.forEach((task, index) => {
      const li = document.createElement("li");

      li.innerHTML = `
        <span class="${task.done ? 'done' : ''}" onclick="toggleTask(${index})">
          ${task.text}
        </span>
        <button onclick="deleteTask(${index})">❌</button>
      `;

      list.appendChild(li);
    });
  }

  function addTask() {
    const input = document.getElementById("taskInput");
    if (input.value === "") return;

    tasks.push({ text: input.value, done: false });
    input.value = "";

    saveTasks();
    renderTasks();
  }

  function toggleTask(index) {
    tasks[index].done = !tasks[index].done;
    saveTasks();
    renderTasks();
  }

  function deleteTask(index) {
    tasks.splice(index, 1);
    saveTasks();
    renderTasks();
  }

  function saveTasks() {
    localStorage.setItem("tasks", JSON.stringify(tasks));
  }

  renderTasks();
</script>

</body>
</html>
